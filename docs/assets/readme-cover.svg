<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="416" viewBox="0 0 1280 416" role="img" aria-labelledby="title description">
  <title id="title">Quire. Lose yourself. Keep your place.</title>
  <desc id="description">Warm paper, burgundy ink and gathered book leaves around Quire's italic q mark. Your books, on a server you own.</desc>
  <defs>
    <clipPath id="cover"><rect width="1280" height="416" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#cover)">
    <rect width="1280" height="416" fill="#F8F4EC"/>
    <rect x="856" width="424" height="416" fill="#4A1A18"/>
    <text x="64" y="62" fill="#7A2E2A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="4">QUIRE</text>
    <g fill="#1F1A14" font-family="Georgia, 'Times New Roman', serif" font-size="68">
      <text x="60" y="157">Lose yourself.</text>
      <text x="60" y="233">Keep your place.</text>
    </g>
    <text x="64" y="288" fill="#8A7355" font-family="Arial, Helvetica, sans-serif" font-size="19">Your books, on a server you own.</text>
    <path d="M64 335h60" stroke="#7A2E2A" stroke-width="2"/>
    <text x="64" y="373" fill="#8A7355" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2">ANDROID · EPUB · SELF-HOSTED</text>
    <!-- Gathered leaves, with a burgundy binding and a paper-coloured fore-edge. -->
    <g fill="none" stroke="#B98D72" stroke-width="1.5" stroke-linejoin="round">
      <path d="M952 62l230-14 16 266-230 14z"/>
      <path d="M952 62l238 2-2 266-238-2z"/>
    </g>
    <rect x="947" y="62" width="230" height="266" rx="5" fill="#F5EFE3"/>
    <path d="M952 317h214m-214 4h214" stroke="#D7C5AC" stroke-width="1"/>
    <rect x="941" y="54" width="230" height="258" rx="5" fill="#7A2E2A"/>
    <path d="M959 55v256" stroke="#A65D4E" stroke-width="1"/>
    <!-- Canonical italic q from app/src/main/res/drawable/ic_launcher_foreground.xml. -->
    <path transform="translate(887 3) scale(2.8)" fill="#F5EFE3" fill-rule="evenodd" d="M68 42C68 34 62 30 55 30C44 30 36 40 36 52C36 62 42 68 51 68C56 68 60 66 64 62L60 84C60 86 61 87 63 87H70C72 87 73 86 73 84L82 30C82 29 81 28 79 28H73C71 28 70 29 70 30ZM55 38C60 38 63 42 62 49C61 56 56 60 51 60C47 60 45 57 45 52C45 45 49 38 55 38Z"/>
    <text x="1068" y="373" text-anchor="middle" fill="#F5EFE3" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="2.5">A LIBRARY OF YOUR OWN</text>
  </g>
</svg>

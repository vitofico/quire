services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: opds_sync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: opds_sync
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opds_sync"]
      interval: 5s
      timeout: 5s
      retries: 10

  quire-server:
    image: ghcr.io/vitofico/quire-server:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Every QUIRE_SERVER_* line in .env reaches the container. The block
    # under `environment:` only pins what this compose topology decides.
    env_file:
      - path: .env
        required: false
    environment:
      QUIRE_SERVER_DATABASE_URL: postgresql+asyncpg://opds_sync:${POSTGRES_PASSWORD:-changeme}@postgres:5432/opds_sync
      # Fail `docker compose up` with a readable message instead of booting a
      # server that cannot authenticate anyone.
      QUIRE_SERVER_CWA_BASE_URL: ${QUIRE_SERVER_CWA_BASE_URL:?set QUIRE_SERVER_CWA_BASE_URL in .env to your calibre-web URL}
    # Lets QUIRE_SERVER_AI_BASE_URL=http://host.docker.internal:11434/v1 reach
    # an Ollama running on the Docker host, on Linux as well as Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${QUIRE_SERVER_PORT:-8000}:8000"
    command: >
      sh -c "python /app/scripts/migrate.py &&
             uvicorn quire_server.main:app --host 0.0.0.0 --port 8000"

volumes:
  pg_data:

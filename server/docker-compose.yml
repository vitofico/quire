services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: opds_sync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: opds_sync
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opds_sync"]
      interval: 5s
      timeout: 5s
      retries: 10

  quire-server:
    image: ${QUIRE_SERVER_IMAGE:-ghcr.io/vitofico/quire-server:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Every QUIRE_SERVER_* line in .env reaches the container. The block
    # under `environment:` only pins what this compose topology decides.
    env_file:
      - path: .env
        required: false
    environment:
      QUIRE_SERVER_DATABASE_URL: postgresql+asyncpg://opds_sync:${POSTGRES_PASSWORD:-changeme}@postgres:5432/opds_sync
      # Fail `docker compose up` with a readable message instead of booting a
      # server that cannot authenticate anyone.
      QUIRE_SERVER_CWA_BASE_URL: ${QUIRE_SERVER_CWA_BASE_URL:?set QUIRE_SERVER_CWA_BASE_URL in .env to your calibre-web URL}
    # Lets QUIRE_SERVER_AI_BASE_URL=http://host.docker.internal:11434/v1 reach
    # an Ollama running on the Docker host, on Linux as well as Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${QUIRE_SERVER_PORT:-8000}:8000"
    # Holds the key that encrypts saved catalog logins, created on first
    # start. Back it up together with the database (docs/configuration.md).
    volumes:
      - quire_keys:/var/lib/quire
      # PDF conversion's job folder, shared with quire-convert below. Unused
      # unless QUIRE_SERVER_CONVERT_ENABLED=true.
      - quire_convert:/var/lib/quire-convert
    command: >
      sh -c "python /app/scripts/migrate.py &&
             uvicorn quire_server.main:app --host 0.0.0.0 --port 8000"

  # PDF to EPUB conversion (docs/configuration.md, "PDF conversion"). Off
  # unless started with `--profile convert` and QUIRE_SERVER_CONVERT_ENABLED=true
  # in .env. It shares one folder with the server and nothing else: no
  # network, no database, a read-only root filesystem.
  quire-convert:
    image: ${QUIRE_CONVERT_IMAGE:-ghcr.io/vitofico/quire-convert:latest}
    profiles: ["convert"]
    # The worker exits after every job, so each conversion starts in a fresh
    # container: nothing a PDF leaves running outlives its job.
    restart: always
    depends_on:
      - quire-server
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=512m
    volumes:
      - quire_convert:/jobs
    init: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # One conversion at a time; Calibre and EPUBCheck peak around 1 to 2 GB on
    # a long book. Raise both for very large PDFs.
    mem_limit: 3g
    cpus: 2
    pids_limit: 256

volumes:
  pg_data:
  quire_keys:
  quire_convert:

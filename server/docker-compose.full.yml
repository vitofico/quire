# Quire full-stack reference compose.
#
# Brings up postgres + calibre-web + quire-server + Caddy with path-based
# routing identical to the production Kubernetes ingress. Use this if
# you want a single base URL with TLS in front of everything.
#
# For "I'll bring my own proxy / I already run calibre-web elsewhere",
# use the minimal `docker-compose.yml` in this directory instead.
#
# Usage:
#   cp .env.example .env
#   # edit .env (set POSTGRES_PASSWORD, mount your calibre library, etc.)
#   docker compose -f docker-compose.full.yml up -d
#
# See server/README.md "Full-stack reference compose" for smoke commands
# and the TLS swap for production.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: opds_sync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: opds_sync
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opds_sync"]
      interval: 5s
      timeout: 5s
      retries: 10

  calibre-web:
    image: crocodilestick/calibre-web-automated:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      # Caddy is the only upstream proxy in this stack.
      TRUSTED_PROXY_COUNT: "1"
    volumes:
      - calibre_config:/config
      # Mount your existing calibre library here. The path inside the
      # container must stay `/calibre-library` for calibre-web-automated.
      # Uncomment and edit:
      # - /path/to/your/calibre-library:/calibre-library
      # Optional: ingest folder for drop-in book imports.
      # - /path/to/your/ingest:/cwa-book-ingest
    healthcheck:
      # OPDS can require credentials. Both 200 and 401 confirm that
      # Calibre-Web is serving the route.
      test:
        - CMD-SHELL
        - curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 http://localhost:8083/opds | grep -Eq '^(200|401)$$'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  quire-server:
    image: ${QUIRE_SERVER_IMAGE:-ghcr.io/vitofico/quire-server:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Every QUIRE_SERVER_* line in .env reaches the container. The block
    # under `environment:` only pins what this compose topology decides:
    # the bundled database and calibre-web catalogue addresses.
    env_file:
      - path: .env
        required: false
    environment:
      QUIRE_SERVER_DATABASE_URL: postgresql+asyncpg://opds_sync:${POSTGRES_PASSWORD:-changeme}@postgres:5432/opds_sync
      QUIRE_SERVER_CWA_BASE_URL: http://calibre-web:8083
      QUIRE_SERVER_WEB_CATALOG_URL: ${QUIRE_SERVER_WEB_CATALOG_URL:-/opds}
    # Lets QUIRE_SERVER_AI_BASE_URL=http://host.docker.internal:11434/v1 reach
    # an Ollama running on the Docker host, on Linux as well as Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Holds the key that encrypts saved catalog logins, created on first
    # start. Back it up together with the database (docs/configuration.md).
    volumes:
      - quire_keys:/var/lib/quire
      # PDF conversion's job folder, shared with quire-convert below. Unused
      # unless QUIRE_SERVER_CONVERT_ENABLED=true.
      - quire_convert:/var/lib/quire-convert
    command: >
      sh -c "python /app/scripts/migrate.py &&
             uvicorn quire_server.main:app --host 0.0.0.0 --port 8000"
    # No `ports:` mapping - quire-server is reached through Caddy.
    # Add `ports: ["8000:8000"]` temporarily for direct debugging.
    healthcheck:
      # /readyz verifies DB connectivity + required-branch-head check.
      # 200 means migrations applied and dependent services reachable.
      # Uses Python's urllib so the slim base image needs no extra
      # binary (curl/wget are not guaranteed on the quire-server image).
      test: ["CMD-SHELL", "python3 -c 'import urllib.request,sys; sys.exit(0) if urllib.request.urlopen(\"http://localhost:8000/readyz\", timeout=5).status == 200 else sys.exit(1)' || exit 1"]
      interval: 10s
      timeout: 7s
      retries: 6
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      quire-server:
        condition: service_healthy
      calibre-web:
        condition: service_healthy
    environment:
      # Set to your hostname (e.g. ebooks.example.com) for a real cert
      # via ACME. Defaults to `localhost` with self-signed `tls internal`.
      QUIRE_SITE_ADDRESS: ${QUIRE_SITE_ADDRESS:-localhost}
    ports:
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTP_PORT:-80}:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Persist Caddy's local CA + cert cache. Without this, `tls
      # internal` regenerates a fresh root CA on every container
      # recreation and clients re-prompt about trust.
      - caddy_data:/data
      - caddy_config:/config

  # PDF to EPUB conversion (docs/configuration.md, "PDF conversion"). Off
  # unless started with `--profile convert` and QUIRE_SERVER_CONVERT_ENABLED=true
  # in .env. It shares one folder with the server and nothing else: no
  # network, no database, a read-only root filesystem.
  quire-convert:
    image: ${QUIRE_CONVERT_IMAGE:-ghcr.io/vitofico/quire-convert:latest}
    profiles: ["convert"]
    restart: unless-stopped
    depends_on:
      - quire-server
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=512m
    volumes:
      - quire_convert:/jobs
    init: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # One conversion at a time; Calibre and EPUBCheck peak around 1 to 2 GB on
    # a long book. Raise both for very large PDFs.
    mem_limit: 3g
    cpus: 2
    pids_limit: 256

volumes:
  pg_data:
  quire_keys:
  quire_convert:
  calibre_config:
  caddy_data:
  caddy_config:

# Example corpus: the generated regression fixtures as development books.
# Build them first with: .venv/bin/python tests/fixtures/build.py
# Paths are relative to this file. A real corpus lists 10 dev and 10 holdout books,
# split by book and edition family; run `quire-convert evaluate corpus.toml --freeze`
# before the first --holdout run, after which any holdout edit is refused.

[corpus]
name = "fixtures"
reference_machine = "machine.json"

[gates]
frozen = false

[[book]]
id = "bridge"
path = "../tests/fixtures/out/bridge.pdf"
labels = "../tests/fixtures/out/bridge.expected.json"
split = "dev"
family = "fixture-bridge"
language = "en"
strata = ["figures", "vector-illustration", "known-failure"]
rights = "original work generated by tests/fixtures/build.py"


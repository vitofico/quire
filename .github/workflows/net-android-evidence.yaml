name: Quire Android safety-net evidence

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quire-net-android-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event.pull_request.head.ref == 'test/lean-safety-net' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Android safety net (functional-mutation recovery)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
        with:
          cache-read-only: true
      - name: Restore Robolectric SDK jars
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ github.sha }}
          restore-keys: robolectric-
      - name: Check missing-request mutant and replay all restored controls
        run: >-
          python3 .github/net-android-evidence/mutate.py "$RUNNER_TEMP/quire-net-android"
          Q3-debounce-sends-no-request --resume
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quire-net-android-functional-mutation-recovery
          path: |
            ${{ runner.temp }}/quire-net-android/*.xml
            ${{ runner.temp }}/quire-net-android/*.log
          retention-days: 7

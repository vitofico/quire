name: android-ci

on:
  # Only main pushes here — that's where the version bump + release run. Feature
  # branches are validated by the pull_request trigger below; without this filter a
  # push to a branch with an open PR fires this workflow twice (once per event).
  push:
    branches: [main]
    paths:
      - "app/**"
      - "auth/**"
      - "core/**"
      - "data/**"
      - "reader/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/android-ci.yaml"
  pull_request:
    paths:
      - "app/**"
      - "auth/**"
      - "core/**"
      - "data/**"
      - "reader/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/android-ci.yaml"
  # "Run workflow" on main releases main as it stands, no commit needed.
  # "Push version bump + tag" below also dispatches a run this way when a
  # merge lands while it builds.
  workflow_dispatch:

# Cancel obsolete runs on PR / branch pushes. On main, never cancel a run in
# flight: one cancelled between its tag push and its release job would leave
# a public tag with no APK (issue #93). Runs queued behind it still collapse,
# since GitHub keeps only the newest pending run in a group; that run builds
# the newest commit, so it releases what the dropped ones would have.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # A healthy run is ~6 minutes. Two runs (2026-07-09, 2026-07-28) hung inside
    # `./gradlew test` and, with no ceiling of our own, were only killed by
    # GitHub's 6-hour maximum-execution limit — burning six runner-hours and, on
    # the second one, stranding a pushed tag with no Release (issue #93). 30
    # minutes is generous for a cold Gradle cache and still fails fast on a hang.
    timeout-minutes: 30
    permissions:
      contents: write   # to push the version-bump commit and tag
      actions: write    # to dispatch a fresh run when main moves under this one
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.push.outputs.released }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # A dispatched run builds main as it stands when the run starts, not
          # when it was requested: it may have sat in the concurrency queue
          # while more commits landed. Other events build their own commit.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || '' }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - id: version
        name: Compute version
        env:
          # Bakes the GitHub-provided token into the origin URL so the later
          # "Push version bump + tag" step can publish the commit and tag.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            # On main: compute the next CalVer from date + run number, write it
            # into gradle.properties and commit + tag it LOCALLY. Nothing is
            # pushed here — "Push version bump + tag" below does that, but only
            # once the tests and lint have passed. Everything Gradle builds in
            # between therefore already carries the bumped version, while a run
            # that fails or hangs leaves origin untouched.
            BUILD_DATE=$(date -u +%Y-%m-%d)
            NEW_NAME="${BUILD_DATE//-/.}.${GITHUB_RUN_NUMBER}"
            # Android refuses an update whose versionCode is lower, and F-Droid
            # only offers one whose code is higher, so the code must rise with
            # every release. yyMMdd*100 + run%100 did not: two releases on one
            # day either side of a multiple of 100 (runs 299 and 300) went
            # from ...99 down to ...00. Take the current code plus one, lifted
            # to yyMMdd*1000 on a new day so the code still reads as the date.
            DAY=${BUILD_DATE//-/}
            DAY_CODE=$(( 10#${DAY:2} * 1000 ))
            PREV_CODE=$(sed -n 's/^VERSION_CODE=//p' gradle.properties)
            NEW_CODE=$(( PREV_CODE + 1 > DAY_CODE ? PREV_CODE + 1 : DAY_CODE ))

            sed -i "s/^VERSION_NAME=.*/VERSION_NAME=$NEW_NAME/" gradle.properties
            sed -i "s/^VERSION_CODE=.*/VERSION_CODE=$NEW_CODE/" gradle.properties

            # Committer identity and the tokenised remote live in .git/config,
            # which — unlike shell state — does survive into later steps, so the
            # push step inherits both without repeating them.
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

            git add gradle.properties
            git commit -m ":bookmark: chore: release v$NEW_NAME"
            git tag -f "v$NEW_NAME"

            # Hand the tag name to the push step rather than letting it derive
            # the name a second time — a run straddling UTC midnight would
            # otherwise push a tag that disagrees with the commit it points at.
            echo "RELEASE_VERSION_NAME=$NEW_NAME" >> "$GITHUB_ENV"

            VERSION="$NEW_NAME"
          else
            # On PRs / feature branches: just read the static value from
            # gradle.properties — no bump, no tag, no commit.
            VERSION=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          fi
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"
      - name: Install ripgrep (rename guard)
        run: |
          if ! command -v rg >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ripgrep
          fi
      - name: Rename guard self-test
        run: |
          set -e
          # Proves the rename-guard regex catches OPDS_SYNC_<X> patterns.
          tmp=$(mktemp /tmp/rename-guard-self-test-XXXX.txt)
          printf 'OPDS_SYNC_AI_ENABLED: true\n' > "$tmp"
          if ! rg -P '\bopds[-_]sync\b|(?<![A-Z0-9_])OPDS_SYNC_[A-Z0-9_]*' "$tmp" >/dev/null; then
            echo "::error::Rename guard regex failed self-test (did NOT match OPDS_SYNC_AI_ENABLED)."
            rm -f "$tmp"
            exit 1
          fi
          rm -f "$tmp"
      - name: Rename guard
        run: |
          set -o pipefail
          # Mirror of the server-ci rename guard. Lives here too because
          # server-ci is path-filtered to server/** and would not run for
          # Android-side regressions that smuggle in legacy names.
          if rg -n -P '\bopds[-_]sync\b|(?<![A-Z0-9_])OPDS_SYNC_[A-Z0-9_]*' \
                -g '!.claude/**' \
                -g '!CHANGELOG.md' \
                -g '!server/migrations/versions/*.py' \
                -g '!server/quire_server/config.py' \
                -g '!server/docker-compose.yml' \
                -g '!server/docker-compose.full.yml' \
                -g '!server/alembic.ini' \
                -g '!server/migrations/env.py' \
                -g '!server/tests/conftest.py' \
                -g '!server/tests/unit/test_no_stale_opds_sync_imports.py' \
                . ; then
            echo "::error::Rename guard found un-allowlisted OPDS_SYNC / opds-sync / opds_sync references."
            exit 1
          fi
      - name: AboutLibraries JSON drift check
        run: |
          set -e
          # app/src/main/res/raw/aboutlibraries.json is checked in and packaged
          # as-is (registerAndroidTasks=false in app/build.gradle.kts) so F-Droid's
          # reproducible-build check passes — the plugin's build-time collector is
          # environment-dependent and produced a non-reproducible res/M7.json.
          # Fail if the committed file drifts from the current release dep graph.
          tmpdir="$(mktemp -d)"
          ./gradlew :app:exportLibraryDefinitions \
            -PaboutLibraries.exportVariant=release \
            -PaboutLibraries.exportPath="$tmpdir" --stacktrace
          if ! diff -u app/src/main/res/raw/aboutlibraries.json "$tmpdir/aboutlibraries.json"; then
            echo "::error::app/src/main/res/raw/aboutlibraries.json is stale. Regenerate: scripts/dgradle :app:exportLibraryDefinitions -PaboutLibraries.exportVariant=release -PaboutLibraries.exportPath=src/main/res/raw"
            exit 1
          fi
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace
      # Robolectric fetches a full Android SDK jar for each API level the tests
      # use (28 and 33) from Maven Central at test time, into ~/.m2, which the
      # Gradle cache does not cover. On 2026-09-24 one of those downloads was
      # reset mid-transfer, the tests failed, and that release was never cut.
      # So the jars are kept between runs. Restore and save are separate steps
      # because a run only fetches the jars its tests need, and Gradle's build
      # cache skips unchanged test tasks entirely: one entry saved under a
      # fixed key would freeze whatever partial set the first run fetched.
      # Instead each entry is named after the jars it holds and saved only
      # when that set grows, and the newest entry is the one restored here.
      - name: Restore Robolectric SDK jars
        id: robolectric-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ github.sha }}
          restore-keys: robolectric-
      - name: Unit tests
        run: ./gradlew test --stacktrace
      - name: List Robolectric SDK jars
        id: robolectric-jars
        run: |
          dir="$HOME/.m2/repository/org/robolectric"
          if [ -d "$dir" ]; then
            echo "key=robolectric-$(cd "$dir" && find . -name '*.jar' | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          fi
      - name: Save Robolectric SDK jars
        if: steps.robolectric-jars.outputs.key != '' && steps.robolectric-jars.outputs.key != steps.robolectric-restore.outputs.cache-matched-key
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ steps.robolectric-jars.outputs.key }}
      - name: Lint
        run: ./gradlew lint --stacktrace
      # The bump commit and tag were created locally by "Compute version"; this
      # is where they become public, and deliberately not one step earlier. When
      # the push happened up front, a build that hung (2026-07-28, killed at
      # GitHub's 6-hour ceiling) left v2026.07.28.223 on origin with no Release
      # and no APK behind it, which is a hard stop for F-Droid's reproducible
      # build check (issue #93). Now the tag only exists publicly if the tree it
      # points at assembled, tested and linted clean.
      - name: Push version bump + tag
        id: push
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Belt and braces: "Compute version" only exports this on main, and
          # this step only runs on main, so an empty value means the two guards
          # have drifted apart and we must not push a "v" tag.
          if [ -z "$RELEASE_VERSION_NAME" ]; then
            echo "::error::Version bump value missing — Compute version did not produce a bump."
            exit 1
          fi

          # --atomic so the branch and the tag land together or not at all.
          # Plain git applies each refspec independently: a branch update
          # rejected as non-fast-forward still lets the brand-new tag through,
          # leaving a tag that points at a commit which never reached main —
          # #93 again, by a shorter route.
          if git push --atomic origin "HEAD:$GITHUB_REF" "v$RELEASE_VERSION_NAME"; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The push is rejected whenever anything lands on main while this
          # run builds, Android change or not: the concurrency group queues
          # android-ci runs, it does not hold back merges. Retrying in place
          # is no answer. Rebasing onto the new tip conflicts on the
          # VERSION_NAME line, and resetting onto it would publish a tag whose
          # tree this run never assembled or tested. Re-running this run does
          # not help either, because a re-run builds the same commit again.
          # So when main has moved on from the commit this run tested, the run
          # releases nothing and dispatches a fresh android-ci run, which
          # builds the new tip (this run's changes plus whatever landed since)
          # and releases it once it passes the same checks.
          git fetch --quiet origin "$GITHUB_REF"
          TIP=$(git rev-parse FETCH_HEAD)
          if git merge-base --is-ancestor HEAD "$TIP"; then
            # git reported a failure, yet the bump commit is on main (say, the
            # connection dropped after the server applied the push). --atomic
            # means the tag landed with it, so release as normal.
            echo "released=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$TIP" = "$(git rev-parse HEAD~1)" ] || ! git merge-base --is-ancestor HEAD~1 "$TIP"; then
            echo "::error::Push failed, and not because main moved on from the tested commit: see the git output above."
            exit 1
          fi
          gh workflow run android-ci.yaml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
          echo "::notice::main moved on while this run built it, so this run released nothing and started a fresh android-ci run to build and release the new tip."
      - name: Upload debug APK
        if: steps.push.outputs.released == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-debug-${{ env.VERSION_NAME }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # On main, once the build job's checks went green and it pushed its tag:
  # check out that tag, build the signed release APK from it and publish a
  # GitHub Release. A build that handed off to a fresh run pushed nothing, so
  # this job skips and the fresh run releases instead.
  # The tag itself is already on origin by now, so the release action only ever
  # attaches a Release to an existing tag rather than creating one. If a runner
  # dies in the gap between the push and this job, the tag is public with no
  # APK — run .github/workflows/release-apk.yaml against that tag to republish
  # without cutting a new version.
  release:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.released == 'true'
    runs-on: ubuntu-latest
    # Same reasoning as the build job: cap the run well under GitHub's 6-hour
    # maximum-execution ceiling so a hung Gradle task fails instead of idling.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: v${{ needs.build.outputs.version }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - name: Decode keystore
        if: env.KEYSTORE_B64 != ''
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
        env:
          KEYSTORE_B64: ${{ secrets.QUIRE_RELEASE_KEYSTORE_B64 }}
      # A blank keystore makes app/build.gradle.kts fall back to the debug
      # signing config, and :app:assembleRelease then succeeds and produces a
      # debug-signed app-release.apk. Publishing that is worse than publishing
      # nothing: F-Droid rejects the signature outright, and anyone who installs
      # it can never upgrade to a properly signed build, because Android refuses
      # to install over a changed signature. Failing here does strand the tag
      # the build job already pushed, but that is the recoverable state: fix the
      # secrets, then run release-apk.yaml against the tag to publish it.
      - name: Require signing secrets
        run: |
          test -s "$RUNNER_TEMP/release.keystore" || {
            echo "::error::Release keystore missing — refusing to publish a debug-signed build."
            exit 1
          }
      - name: Assemble release APK
        env:
          QUIRE_RELEASE_KEYSTORE: ${{ secrets.QUIRE_RELEASE_KEYSTORE_B64 != '' && format('{0}/release.keystore', runner.temp) || '' }}
          QUIRE_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.QUIRE_RELEASE_KEYSTORE_PASSWORD }}
          QUIRE_RELEASE_KEY_ALIAS: ${{ secrets.QUIRE_RELEASE_KEY_ALIAS }}
          QUIRE_RELEASE_KEY_PASSWORD: ${{ secrets.QUIRE_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: v${{ needs.build.outputs.version }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          # A Release with no APK is the state that blocks F-Droid, so if the
          # glob ever stops matching (an AGP output-path change, a variant
          # rename) fail loudly instead of publishing an empty Release green.
          fail_on_unmatched_files: true

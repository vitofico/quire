name: quire-net-evidence

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  verify:
    if: >-
      github.repository == 'vitofico/quire' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'test/lean-safety-net' &&
      github.event.before == '72cc8e68628a52553ffc3198a3bca5278542a8dc' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      QUIRE_SERVER_PROGRESS_ENABLED: "true"
      QUIRE_SERVER_AI_ENABLED: "true"
      QUIRE_EVIDENCE_CASES: A1-P4-attribution-retention A9-hosted-sync-denies-valid-write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
      - name: Install server test dependencies
        working-directory: server
        run: |
          uv python install 3.12
          uv venv --python 3.12
          uv pip install -e '.[dev]'
      - name: Verify targeted regression controls
        run: server/.venv/bin/python .github/scripts/quire-net-evidence.py "$RUNNER_TEMP/quire-net-evidence"
      - name: Retain focused JUnit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quire-net-evidence
          path: ${{ runner.temp }}/quire-net-evidence
          if-no-files-found: error
          retention-days: 3

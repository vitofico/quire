name: server-ci

on:
  # Only main pushes here; feature branches are validated by the pull_request trigger
  # below. Without the branch filter a push to a branch with an open PR runs this
  # workflow twice (once per event). Mirrors android-ci.yaml / codeql.yaml.
  push:
    branches: [main]
    paths:
      - "server/**"
      - "web/**"
      - "catalogs/**"
      - "reader/src/main/assets/**"
      - "reader/src/test/resources/highlights/**"
      - "scripts/make-reader-pause-fixture.py"
      - "branding/**"
      - "LICENSE"
      - "NOTICE"
      - "docs/configuration.md"
      - ".github/workflows/server-ci.yaml"
      - "core/identity/src/test/resources/identity/**"
      - "converter/tests/fixtures/worker-results.json"
  pull_request:
    paths:
      - "server/**"
      - "web/**"
      - "catalogs/**"
      - "reader/src/main/assets/**"
      - "reader/src/test/resources/highlights/**"
      - "scripts/make-reader-pause-fixture.py"
      - "branding/**"
      - "LICENSE"
      - "NOTICE"
      - "docs/configuration.md"
      - ".github/workflows/server-ci.yaml"
      - "core/identity/src/test/resources/identity/**"
      - "converter/tests/fixtures/worker-results.json"

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [full, sync_only, ai_only]
    defaults:
      run:
        working-directory: server
    env:
      # Match the app flags to the branch-limited schema selected by --ci-mode.
      # The full lane owns the general suite; the partial lanes exercise real deployments.
      QUIRE_SERVER_PROGRESS_ENABLED: ${{ matrix.mode != 'ai_only' && 'true' || 'false' }}
      QUIRE_SERVER_AI_ENABLED: ${{ matrix.mode != 'sync_only' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Set up Python
        run: uv python install 3.12
      - name: Install
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: Lint
        if: matrix.mode == 'full'
        run: uv run ruff check . && uv run ruff format --check .
      - name: Install ripgrep (rename guard)
        if: matrix.mode == 'full'
        run: |
          if ! command -v rg >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ripgrep
          fi
      - name: Rename guard self-test
        if: matrix.mode == 'full'
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          # Proves the rename-guard regex catches the previously-missed
          # OPDS_SYNC_FOO pattern (the v1 plan's regex relied on \b after
          # `_`, which is not a word boundary before letters).
          tmp=$(mktemp /tmp/rename-guard-self-test-XXXX.txt)
          printf 'OPDS_SYNC_AI_ENABLED: true\n' > "$tmp"
          if ! rg -P '\bopds[-_]sync\b|(?<![A-Z0-9_])OPDS_SYNC_[A-Z0-9_]*' "$tmp" >/dev/null; then
            echo "::error::Rename guard regex failed self-test (did NOT match OPDS_SYNC_AI_ENABLED)."
            rm -f "$tmp"
            exit 1
          fi
          rm -f "$tmp"
      - name: Rename guard
        if: matrix.mode == 'full'
        working-directory: ${{ github.workspace }}
        run: |
          set -o pipefail
          # Lock #20 allowlist:
          #   .claude/, CHANGELOG.md, server/migrations/versions/,
          #   root README.md, server/docker-compose*.yml,
          #   server/alembic.ini, server/.env.example (DB-name / deprecation refs).
          # Defensive: tests/conftest.py + the import-graph regression test
          # reference the legacy names by design.
          if rg -n -P '\bopds[-_]sync\b|(?<![A-Z0-9_])OPDS_SYNC_[A-Z0-9_]*' \
                -g '!.claude/**' \
                -g '!CHANGELOG.md' \
                -g '!server/migrations/versions/*.py' \
                -g '!server/quire_server/config.py' \
                -g '!server/docker-compose.yml' \
                -g '!server/docker-compose.full.yml' \
                -g '!server/alembic.ini' \
                -g '!server/migrations/env.py' \
                -g '!server/tests/conftest.py' \
                . ; then
            echo "::error::Rename guard found un-allowlisted OPDS_SYNC / opds-sync / opds_sync references."
            exit 1
          fi
      - name: Test
        id: pytest
        env:
          CI_MODE: ${{ matrix.mode }}
        run: uv run pytest -v --ci-mode="$CI_MODE" --junitxml="$RUNNER_TEMP/server-junit.xml"
      - name: Retain server test results
        if: ${{ !cancelled() && steps.pytest.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-tests-${{ matrix.mode }}
          path: ${{ runner.temp }}/server-junit.xml
          if-no-files-found: error
          retention-days: 3

  web-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QUIRE_SERVER_IMAGE: quire-server:ci
      QUIRE_SERVER_CWA_BASE_URL: http://localhost:8083
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          file: server/Dockerfile
          load: true
          tags: quire-server:ci
          build-args: QUIRE_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
      - name: Run web unit and cross-browser tests
        id: web-tests
        working-directory: web
        run: |
          npm install --global pnpm@9.15.9
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
          pnpm exec playwright install --with-deps chromium firefox webkit
          pnpm test:e2e
      - name: Retain failed browser diagnostics
        if: ${{ failure() && steps.web-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-browser-test-failures
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 3
      - name: Smoke packaged Quire Web
        working-directory: server
        run: |
          touch .env
          docker compose -f docker-compose.full.yml config --quiet
          docker compose up -d --wait --wait-timeout 180
          curl --fail --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8000/readyz
          python3 scripts/smoke_web.py http://localhost:8000 "$GITHUB_SHA"
      - name: Smoke the HTTPS Caddy and Calibre-Web topology
        working-directory: server
        env:
          CADDY_HTTP_PORT: 18080
          CADDY_HTTPS_PORT: 18443
        run: |
          docker compose -p quire-web-full -f docker-compose.full.yml up -d --wait --wait-timeout 180
          docker compose -p quire-web-full -f docker-compose.full.yml cp caddy:/data/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/quire-caddy.crt"
          SSL_CERT_FILE="$RUNNER_TEMP/quire-caddy.crt" python3 scripts/smoke_web.py https://localhost:18443 "$GITHUB_SHA"
          code=$(curl --cacert "$RUNNER_TEMP/quire-caddy.crt" --silent --show-error --output /dev/null --write-out '%{http_code}' https://localhost:18443/opds)
          test "$code" = 200 || test "$code" = 401
      - name: Verify offline navigation and API cache isolation
        run: node web/scripts/smoke-offline.mjs
      - name: Print deployment logs on failure
        if: failure()
        working-directory: server
        run: |
          docker compose logs --tail=100
          CADDY_HTTP_PORT=18080 CADDY_HTTPS_PORT=18443 docker compose -p quire-web-full -f docker-compose.full.yml logs --tail=100
      - name: Shut down deployment
        if: always()
        working-directory: server
        run: |
          docker compose down -v
          CADDY_HTTP_PORT=18080 CADDY_HTTPS_PORT=18443 docker compose -p quire-web-full -f docker-compose.full.yml down -v

  image:
    needs: [test, web-package]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          file: server/Dockerfile
          cache-from: type=gha
          push: true
          sbom: true
          provenance: mode=max
          build-args: |
            QUIRE_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/quire-server:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/quire-server:latest

  scan:
    # SARIF upload requires Code Scanning enabled, which is free on
    # public repos and gated behind GitHub Advanced Security on private
    # ones. Skip until the repo is public.
    needs: image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event.repository.visibility == 'public'
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    steps:
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/quire-server:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@7c1e4cf0b20d7c1872b26569c00ba908797a59bf # v4
        with:
          sarif_file: trivy.sarif

name: Quire server slim-suite evidence

on: pull_request

permissions:
  contents: read

concurrency:
  group: quire-slim-server-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evidence:
    if: >-
      github.event.pull_request.head.ref == 'test/streamline-suites' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Server slim evidence (functional-mutation recovery)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      QUIRE_SERVER_PROGRESS_ENABLED: "true"
      QUIRE_SERVER_AI_ENABLED: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Set up Python and candidate dependencies
        working-directory: server
        run: |
          uv python install 3.12
          uv venv --python 3.12
          uv pip install -e ".[dev]"
      - name: Install the production rename guard dependency
        run: |
          if ! command -v rg >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ripgrep
          fi
      - name: Replay server controls, functional changes and restored controls
        run: |
          python3 .github/slim-server-evidence/evidence.py "$RUNNER_TEMP/quire-slim-server"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Retain JUnit, timings and setup evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quire-slim-server-functional-mutation-recovery
          path: |
            ${{ runner.temp }}/quire-slim-server/*.log
            ${{ runner.temp }}/quire-slim-server/*.tsv
            ${{ runner.temp }}/quire-slim-server/*.xml
          retention-days: 7

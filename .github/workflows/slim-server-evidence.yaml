name: Quire server slim-suite evidence

on: pull_request

permissions:
  contents: read

concurrency:
  group: quire-slim-server-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evidence:
    if: >-
      github.event.pull_request.head.ref == 'test/streamline-suites' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Server slim evidence (${{ matrix.check }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        check: [timed-full, functional-mutations]
    env:
      QUIRE_SERVER_PROGRESS_ENABLED: "true"
      QUIRE_SERVER_AI_ENABLED: "true"
      PYTHONDONTWRITEBYTECODE: "1"
      NET_BASE: fc2a7e7091c56c7b2188d18348d55d387dafcfaa
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Set up Python and candidate dependencies
        working-directory: server
        run: |
          uv python install 3.12
          uv venv --python 3.12
          uv pip install -e ".[dev]"
      - name: Install identical baseline dependencies
        if: matrix.check == 'timed-full'
        run: |
          git worktree add --detach "$RUNNER_TEMP/quire-slim-server-base" "$NET_BASE"
          cd "$RUNNER_TEMP/quire-slim-server-base/server"
          uv venv --python 3.12
          uv pip install -e ".[dev]"
      - name: Time full baseline and slim suites on one runner
        if: matrix.check == 'timed-full'
        run: |
          python3 .github/slim-server-evidence/evidence.py "$RUNNER_TEMP/quire-slim-server" \
            --baseline "$RUNNER_TEMP/quire-slim-server-base"
      - name: Replay server controls, functional changes and restored controls
        if: matrix.check == 'functional-mutations'
        run: |
          python3 .github/slim-server-evidence/evidence.py "$RUNNER_TEMP/quire-slim-server"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Retain JUnit, timings and setup evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quire-slim-server-${{ matrix.check }}
          path: |
            ${{ runner.temp }}/quire-slim-server/*.log
            ${{ runner.temp }}/quire-slim-server/*.tsv
            ${{ runner.temp }}/quire-slim-server/*.xml
          retention-days: 7

name: release-apk

# Repair assets for an existing CalVer tag. Existing APK bytes are downloaded
# and verified first; only missing assets are uploaded. Never replace an asset.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to repair, e.g. v2026.07.28.223"
        required: true
        type: string

# Shared with android-ci's release job, including the v prefix.
concurrency:
  group: quire-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true
      # Historical tags predate the verification/publishing helpers. Use the
      # tooling from the trusted workflow commit while building the old source.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          sparse-checkout: scripts
          persist-credentials: false
      - name: Verify the tag and its source version
        env:
          TAG: ${{ inputs.tag }}
        run: python3 .release-tools/scripts/android-release.py --root "$GITHUB_WORKSPACE" --tag "$TAG"
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - name: Reuse an existing immutable APK
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          python3 .release-tools/scripts/publish-release.py --repo "$GITHUB_REPOSITORY" --tag "$TAG" \
            --fetch-existing app-release.apk --destination app/build/outputs/apk/release/app-release.apk >> "$GITHUB_OUTPUT"
      - name: Require signing secrets
        if: steps.existing.outputs.existing != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.QUIRE_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.QUIRE_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.QUIRE_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.QUIRE_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || {
            echo "::error::All four release signing secrets are required; refusing an unsigned or debug-signed release."
            exit 1
          }
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"
      - name: Assemble release APK
        if: steps.existing.outputs.existing != 'true'
        env:
          QUIRE_RELEASE_KEYSTORE: ${{ format('{0}/release.keystore', runner.temp) }}
          QUIRE_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.QUIRE_RELEASE_KEYSTORE_PASSWORD }}
          QUIRE_RELEASE_KEY_ALIAS: ${{ secrets.QUIRE_RELEASE_KEY_ALIAS }}
          QUIRE_RELEASE_KEY_PASSWORD: ${{ secrets.QUIRE_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Retain release R8 mapping when rebuilding
        if: steps.existing.outputs.existing != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-mapping-${{ inputs.tag }}
          path: app/build/outputs/mapping/release/mapping.txt
          # Older tags predate R8; their source legitimately has no mapping.
          if-no-files-found: ignore
      - name: Verify APK and record its source identity
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python3 .release-tools/scripts/android-release.py --root "$GITHUB_WORKSPACE" --tag "$TAG" \
            --apk app/build/outputs/apk/release/app-release.apk \
            --build-tools "$ANDROID_HOME/build-tools/34.0.0" \
            --certificate-sha256 .release-tools/scripts/release-certificate-sha256.txt
      - name: Publish missing immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          # A newer release may appear while this repair runs. Never change
          # Latest from recovery; existing release metadata remains untouched.
          python3 .release-tools/scripts/publish-release.py --repo "$GITHUB_REPOSITORY" --tag "$TAG" --latest false \
            --asset app/build/outputs/apk/release/app-release.apk \
            --asset app/build/outputs/apk/release/app-release.apk.sha256 \
            --asset app/build/outputs/apk/release/release-identity.json
      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
